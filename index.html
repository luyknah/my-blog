<!DOCTYPE html>
<!-- Apple 디자인 시스템 적용 버전 (연습용) -->
<!-- 핵심: 넉넉한 여백, SF 계열 폰트, Action Blue(#0066cc), 둥근 알약 버튼 -->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>결의 블로그</title>
  <style>
    /* Apple 타이포: 시스템 폰트 스택 (애플 기기에서는 SF Pro로 보임) */
    body {
      font-family: -apple-system, "SF Pro Text", system-ui, sans-serif;
      margin: 0; color: #1d1d1f; background: #ffffff;
      line-height: 1.47; letter-spacing: -0.374px;
    }
    /* 상단 검은 내비게이션 바 (높이 44px, 작은 글자) */
    nav {
      background: #000000; height: 44px;
      display: flex; align-items: center; justify-content: center; gap: 32px;
    }
    nav a { color: #ffffff; text-decoration: none; font-size: 12px; letter-spacing: -0.12px; opacity: 0.9; }
    nav a:hover { opacity: 1; }
    /* 히어로: 큰 제목 56px, 굵기 600, 자간 좁게 */
    .hero { text-align: center; padding: 80px 20px; }
    .hero h1 {
      font-family: -apple-system, "SF Pro Display", system-ui, sans-serif;
      font-size: 56px; font-weight: 600; line-height: 1.07; letter-spacing: -0.28px;
      margin: 0 0 16px;
    }
    .hero p { font-size: 21px; color: #1d1d1f; margin: 0; }
    /* 알약 버튼: 파란 배경 + 완전 둥근 모서리 */
    .btn {
      display: inline-block; margin-top: 24px;
      background: #0066cc; color: #ffffff; text-decoration: none;
      padding: 11px 22px; border-radius: 9999px; font-size: 17px;
    }
    .btn:hover { background: #0071e3; }
    /* 파치먼트 섹션: #f5f5f7 배경의 카드 영역 */
    .section-parchment { background: #f5f5f7; padding: 80px 20px; text-align: center; }
    .section-parchment h2 {
      font-family: -apple-system, "SF Pro Display", system-ui, sans-serif;
      font-size: 40px; font-weight: 600; letter-spacing: -0.28px; margin: 0 0 12px;
    }
    .section-parchment p { font-size: 17px; max-width: 600px; margin: 0 auto 8px; }
    /* 텍스트 링크: 파란색 (#0066cc) */
    a.link { color: #0066cc; text-decoration: none; font-size: 17px; }
    a.link:hover { text-decoration: underline; }
    /* 글 목록 영역 */
    .posts { max-width: 680px; margin: 0 auto; padding: 80px 20px; }
    .posts h2 {
      font-family: -apple-system, "SF Pro Display", system-ui, sans-serif;
      font-size: 34px; font-weight: 600; letter-spacing: -0.374px; margin: 0 0 24px;
    }
    .posts li { margin-bottom: 12px; font-size: 17px; }
    .posts .date { color: #7a7a7a; font-size: 14px; }
    footer {
      background: #f5f5f7; padding: 24px 20px; text-align: center;
      font-size: 12px; color: #7a7a7a; letter-spacing: -0.12px;
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html">결의 블로그</a>
    <a href="#posts">글 목록</a>
    <a href="https://github.com/luyknah/my-blog">GitHub</a>
  </nav>

  <div class="hero">
    <h1>결의 블로그.</h1>
    <p>IT 기기와 AI 활용 경험을 기록합니다.</p>
    <a class="btn" href="#posts">글 보러 가기</a>
  </div>

  <div class="section-parchment">
    <h2>첫 글.</h2>
    <p><strong>AI 활용 스킬을 시작한 이유</strong></p>
    <p>IT 분야, 특히 IT 기기에 관심이 많아 AI 활용 스킬을 쌓기로 했습니다. 작은 실습부터 차근차근 기록해 보려고 합니다.</p>
  </div>

  <div class="posts" id="posts">
    <h2>글 목록</h2>
    <ul>
      <li><a class="link" href="post2.html">GitHub Pages로 홈페이지 배포하기</a> <span class="date">2026-10-13</span></li>
    </ul>
  </div>

  <footer>© 2026 결의 블로그. Apple 디자인 시스템으로 연습 중.</footer>

</body>
</html>
