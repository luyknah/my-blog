<!DOCTYPE html>
<!-- 위 한 줄은 "이 문서는 HTML입니다"라고 브라우저에게 알리는 선언이에요 -->
<html lang="ko">
<!-- html: 페이지 전체를 감싸는 태그. lang="ko"는 "한국어 페이지"라는 뜻 -->

<head>
  <!-- head: 눈에 보이지 않는 설정 구역 -->
  <meta charset="UTF-8">
  <!-- charset: 한글 깨짐 방지. 없으면 한글이 ????로 보여요 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- viewport: 모바일 화면 크기에 맞추라는 설정 -->
  <title>결의 블로그</title>
  <!-- title: 브라우저 탭에 보이는 제목 -->
  <style>
    /* style: 디자인 구역. CSS라는 언어로 씁니다 */
    body { font-family: sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; line-height: 1.7; color: #333; }
    h1 { color: #1a73e8; }
    .post { background: #f5f7fa; border-radius: 12px; padding: 20px; margin-top: 24px; }
    footer { margin-top: 40px; font-size: 13px; color: #888; }
  </style>
</head>

<body>
  <!-- body: 눈에 보이는 실제 내용 구역 -->

  <h1>결의 블로그</h1>
  <!-- h1: 가장 큰 제목 -->

  <p>IT 기기와 AI 활용 경험을 기록하는 블로그입니다. </p>
  <!-- p: 문단 -->
  <img src="images/logo.jpg" alt="한자 이름" style="width:100%; border-radius:12px;">


  <div class="post">
    <!-- div: 내용 묶음 상자. class="post"는 위 style에서 꾸민 이름 -->
    <h2>첫 글: AI 활용 스킬을 시작한 이유</h2>
    <!-- h2: h1보다 한 단계 작은 제목 -->
    <p>IT 분야, 특히 IT 기기에 관심이 많아 AI 활용 스킬을 쌓기로 했습니다. 작은 실습부터 차근차근 기록해 보려고 합니다.</p>
    <a href="https://github.com">GitHub 구경하기</a>
    <!-- a: 링크. href="주소"를 누르면 이동해요 -->
  </div>

  <h2>글 목록</h2>
  <!-- ul: 순서 없는 목록 (• 글머리 기호가 붙어요) -->
  <ul>
    <!-- href="post2.html"은 같은 폴더의 post2.html 파일로 연결돼요 -->
    <li><a href="post2.html">GitHub Pages로 홈페이지 배포하기</a> (2026-10-13)</li>
  </ul>

  <footer>© 2026 결의 블로그</footer>
  <!-- footer: 페이지 맨 아래 꼬리말 -->

</body>
</html>
